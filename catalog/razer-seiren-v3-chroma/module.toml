# peri module: Razer Seiren V3 Chroma microphone, controlled over Razer's vendor feature
# reports (the "razer" engine). The file format is described in catalog/drop-ctrl-v2/module.toml.
#
# No capabilities yet: nothing here offers lighting controls to a panel until the daemon can
# really drive them. `peri status` reads it and `peri set ... brightness=N` changes its brightness
# (the device keeps the value, so sets are not for sliders).

schema = 1
id = "razer-seiren-v3-chroma"
name = "Razer Seiren V3 Chroma"
version = "0.1.0"
engine = "razer"

[match]
vid = 0x1532
pid = 0x056f
usage_page = 0xff53
usage = 0x04

[limits]
# The brightness range of the protocol (one byte), not a limit read from the device: the
# daemon refuses brightness writes for a module that states none.
max_brightness = 255
