# peri module: Razer Seiren V3 Chroma microphone, controlled over Razer's vendor feature
# reports (the "razer" engine). The file format is described in catalog/drop-ctrl-v2/module.toml.
#
# No capabilities yet: the engine only answers read queries (`peri razer <node> firmware`),
# so nothing here offers lighting controls until the daemon can really drive them.

schema = 1
id = "razer-seiren-v3-chroma"
name = "Razer Seiren V3 Chroma"
version = "0.1.0"
engine = "razer"

[match]
vid = 0x1532
pid = 0x056f
usage_page = 0xff53
usage = 0x04
