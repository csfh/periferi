# peri module: Drop CTRL v2 keyboard, controlled over QMK XAP.
#
# schema        module file format version (this file is 1)
# id            lowercase letters, digits and '-'; must equal the directory name
# engine        built-in protocol engine that does the talking ("xap", "razer", "razer90" or "v4l2")
# [match]       which HID interface this module drives. vid and pid are required;
#               usage_page and usage pick the one interface of the device
# [capabilities] what the module can do, for the UI and the daemon
# [limits]      limits the daemon enforces on every write

schema = 1
id = "drop-ctrl-v2"
name = "Drop CTRL v2"
version = "0.2.0"
engine = "xap"

[match]
vid = 0x359b
pid = 0x0009
usage_page = 0xff51
usage = 0x58

[capabilities]
rgb = true

[limits]
# The board's own brightness limit: rgb_matrix.max_brightness in the configuration blob that the
# keyboard serves over XAP (`peri blob <node>`, gzip JSON). Read from the board on 2026-10-13, not
# from memory. The daemon refuses any brightness above it.
max_brightness = 191
