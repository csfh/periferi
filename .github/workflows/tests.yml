name: tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the build tools
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build libasound2-dev
      - name: Build
        run: |
          cmake -S . -B build -G Ninja
          cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
